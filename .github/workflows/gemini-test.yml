name: Gemini test (manual)

# Task 058 part 1: test of the Gemini two-step AI enrichment on 55 events;
# task 059: cost tuning of the steps (mode tune).
# Manual only. Does not touch events.json or GitHub Pages; results are a
# workflow artifact (JSON) plus the job summary.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = models, run = 058 test, tune = 059 cost tuning'
        required: false
        default: 'list'
      model:
        description: 'Gemini model id'
        required: false
        default: 'gemini-3.6-flash'
      ids:
        description: 'Only these event ids (comma-separated, empty = all 55)'
        required: false
        default: ''
      variants:
        description: 'tune: variants (comma-separated, empty = all A-F)'
        required: false
        default: ''
      budget:
        description: 'tune: stop new AI calls above this spend (USD)'
        required: false
        default: '0.3'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODEL: ${{ inputs.model }}
          TEST_OUT: test-out
          TEST_IDS: ${{ inputs.ids }}
          TEST_VARIANTS: ${{ inputs.variants }}
          TEST_BUDGET_USD: ${{ inputs.budget }}
        run: python -m pipeline.gemini_test ${{ inputs.mode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-test-${{ github.run_id }}
          path: test-out/
          retention-days: 30
