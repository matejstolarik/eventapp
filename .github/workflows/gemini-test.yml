name: Gemini test (manual)

# Task 058 part 1: test of the Gemini two-step AI enrichment on 55 events.
# Manual only. Does not touch events.json or GitHub Pages; results are a
# workflow artifact (JSON) plus the job summary.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = models available to the key, run = the test'
        required: false
        default: 'list'
      model:
        description: 'Gemini model id'
        required: false
        default: 'gemini-3.5-flash'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODEL: ${{ inputs.model }}
          TEST_OUT: test-out
        run: python -m pipeline.gemini_test ${{ inputs.mode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-test-${{ github.run_id }}
          path: test-out/
          retention-days: 30
