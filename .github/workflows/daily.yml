name: Daily pipeline

on:
  schedule:
    # 04:17 UTC = 05:17 Prague winter time (CET) / 06:17 summer (CEST)
    # Off-the-hour to avoid GitHub Actions high-load period at :00
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      reenrich_ids:
        description: 'Event ids to re-run AI enrichment for, ignoring the cache (comma-separated, manual runs only)'
        required: false
        default: ''
      reenrich_days:
        description: 'Re-run AI enrichment for ALL events of the next N days (max 60), ignoring the cache (task 062 recompute)'
        required: false
        default: ''
      reenrich_from_research:
        description: 'Re-run the decision step from stored research, no search ("all" or comma-separated ids)'
        required: false
        default: ''
      ai_budget_usd:
        description: 'DeepSeek budget of this run in USD (default 0.30; month limit 5 USD always applies)'
        required: false
        default: ''
      research_seed:
        description: 'One-off: research store file(s) in the repo merged into the stored research (task 065, e.g. docs/tasks/065/research-2026-11-run44172530495.json)'
        required: false
        default: ''
      enrich_timeout_s:
        description: 'AI enrichment wall-clock limit in seconds (default 1500)'
        required: false
        default: ''
      simulate_zero_source:
        description: 'Test switch (task 057): venue id whose sources are recorded with 0 events in the run summary -> alert issue (events.json unchanged)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write     # task 057: alert issues

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Log run metadata
        run: |
          STARTED="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "## Run info" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Started:** ${STARTED}" >> $GITHUB_STEP_SUMMARY
          SCHED_MINS=$(( 4 * 60 + 17 ))
          ACTUAL_MINS=$(( 10#$(date -u '+%H') * 60 + 10#$(date -u '+%M') ))
          DELAY_MINS=$(( ACTUAL_MINS - SCHED_MINS ))
          if [ $DELAY_MINS -lt 0 ]; then DELAY_MINS=$(( DELAY_MINS + 1440 )); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "- **Delay vs 04:17 UTC:** ${DELAY_MINS}m" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Delay vs 04:17 UTC:** n/a (manual)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Trigger: ${{ github.event_name }}, Started: ${STARTED}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # pip cache intentionally omitted; EVENTAPP_DEV_CACHE is not set,
          # so the HTTP dev cache is disabled in CI.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
        # If tests fail, the job stops here and nothing is published.

      - name: Cache venue thumbnails
        # task 082: site/img/venues also holds card/ and detail/; the key includes
        # thumbs.py so a change of the generated files saves a new cache
        uses: actions/cache@v4
        with:
          path: site/img/venues
          key: venue-thumbs-${{ hashFiles('data/venues.json', 'pipeline/thumbs.py') }}
          restore-keys: venue-thumbs-

      - name: Cache event thumbnails
        uses: actions/cache@v4
        with:
          path: site/img/events
          key: event-thumbs-${{ github.run_id }}
          restore-keys: event-thumbs-

      - name: Cache stored AI research
        # task 065: site/research is kept between runs here too, so an error
        # of the published (Pages) copy cannot empty the research store
        uses: actions/cache@v4
        with:
          path: site/research
          key: research-${{ github.run_id }}
          restore-keys: research-

      - name: Restore run summaries
        # task 057: daily numbers of the last 60 days (alerts, weekly report)
        uses: actions/cache/restore@v4
        with:
          path: data/cache/run_summaries
          key: run-summaries-${{ github.run_id }}
          restore-keys: run-summaries-

      - name: Run pipeline
        env:
          PREVIOUS_EVENTS_URL: https://matejstolarik.github.io/eventapp/events.json
          # task 062: AI classification + AI enrichment with DeepSeek (variant A).
          # Backup: ENRICH_PROVIDER: claude (needs ANTHROPIC_API_KEY, kept below).
          # Gemini with Google Search is refused in code (task 060).
          ENRICH_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_RUN_BUDGET_USD: ${{ inputs.ai_budget_usd }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_FORCE_IDS: ${{ inputs.reenrich_ids }}
          ENRICH_FORCE_DAYS: ${{ inputs.reenrich_days }}
          ENRICH_FROM_RESEARCH: ${{ inputs.reenrich_from_research }}
          ENRICH_TIMEOUT_S: ${{ inputs.enrich_timeout_s }}
          RESEARCH_SEED: ${{ inputs.research_seed }}
          ALERT_SIMULATE_ZERO: ${{ inputs.simulate_zero_source }}
        run: python -m pipeline.main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Copy web app into site/
        # Merges dist/ into site/ so events.json and the app coexist.
        # web/dist/ is built with base=/eventapp/, its files go into site/.
        run: cp -r web/dist/. site/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Alerts (GitHub issues)
        # task 057: failed run, source with 0 events / drop > 50 %, AI month limit.
        # Also records the job result in today's run summary.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pipeline.alerts --workflow daily --job-status ${{ job.status }}

      - name: Save run summaries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/run_summaries
          key: run-summaries-${{ github.run_id }}
