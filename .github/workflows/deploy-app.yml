name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Fetch current events.json (preserve pipeline data)
        # If the fetch fails (first deploy), skip gracefully.
        run: |
          mkdir -p site
          curl -sf https://matejstolarik.github.io/eventapp/events.json -o site/events.json \
            && echo "events.json fetched" \
            || echo "events.json not available yet, skipping"

      - name: Copy web app into site/
        # web/dist/ was built with base=/eventapp/, its index.html and assets go into site/.
        run: cp -r web/dist/. site/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## Deploy info" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- events.json: preserved from live Pages (or absent on first deploy)" >> $GITHUB_STEP_SUMMARY
          echo "- web app: built from web/ and deployed to site root" >> $GITHUB_STEP_SUMMARY
