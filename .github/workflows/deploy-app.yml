name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/genre_hierarchy.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write     # task 057: alert issue when the deploy fails

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Fetch current events.json (preserve pipeline data)
        # If the fetch fails (first deploy), skip gracefully.
        run: |
          mkdir -p site
          curl -sf https://matejstolarik.github.io/eventapp/events.json -o site/events.json \
            && echo "events.json fetched" \
            || { echo "events.json not available yet, skipping"; exit 0; }
          # task 054: pipeline state (price checks, monthly AI search counter)
          curl -sf https://matejstolarik.github.io/eventapp/pipeline_state.json -o site/pipeline_state.json || echo "pipeline_state.json not available, skipping"

      - name: Fetch venue thumbnails (preserve pipeline images)
        # Download each image_thumb, image_card and image_detail (task 082) listed in events.json venues
        # so the UI has them after a UI-only deploy.
        # Missing files are skipped with a warning; failures never abort the deploy.
        run: |
          if [ ! -f site/events.json ]; then
            echo "No events.json — skipping venue thumbnail fetch"
            exit 0
          fi
          THUMBS=$(python3 -c "
          import json, sys
          data = json.load(open('site/events.json'))
          paths = [v[k] for v in data.get('venues', []) for k in ('image_thumb', 'image_card', 'image_detail') if v.get(k)]
          print('\n'.join(paths))
          " 2>/dev/null || true)
          if [ -z "$THUMBS" ]; then
            echo "No venue thumbnails listed in events.json"
            exit 0
          fi
          BASE="https://matejstolarik.github.io/eventapp"
          COUNT=0
          while IFS= read -r thumb; do
            dir="site/$(dirname "$thumb")"
            mkdir -p "$dir"
            if curl -sf "$BASE/$thumb" -o "site/$thumb"; then
              COUNT=$((COUNT + 1))
            else
              echo "Warning: could not fetch $thumb"
            fi
          done <<< "$THUMBS"
          echo "Venue thumbnails fetched: $COUNT"

      - name: Fetch event thumbnails and detail images (preserve pipeline images)
        # Download each image_thumb and image_detail from events[] so the UI has them after a
        # UI-only deploy (image_detail added after task 071: without it the event page got a 404,
        # fell back to image_url and flashed).
        # Missing files are skipped with a warning; failures never abort the deploy.
        run: |
          if [ ! -f site/events.json ]; then
            echo "No events.json — skipping event thumbnail fetch"
            exit 0
          fi
          THUMBS=$(python3 -c "
          import json, sys
          data = json.load(open('site/events.json'))
          paths = [e[k] for e in data.get('events', []) for k in ('image_thumb', 'image_detail') if e.get(k)]
          print('\n'.join(paths))
          " 2>/dev/null || true)
          if [ -z "$THUMBS" ]; then
            echo "No event thumbnails listed in events.json"
            exit 0
          fi
          BASE="https://matejstolarik.github.io/eventapp"
          COUNT=0
          while IFS= read -r thumb; do
            dir="site/$(dirname "$thumb")"
            mkdir -p "$dir"
            if curl -sf "$BASE/$thumb" -o "site/$thumb"; then
              COUNT=$((COUNT + 1))
            else
              echo "Warning: could not fetch $thumb"
            fi
          done <<< "$THUMBS"
          echo "Event images fetched: $COUNT"

      - name: Copy web app into site/
        # web/dist/ was built with base=/eventapp/, its index.html and assets go into site/.
        run: cp -r web/dist/. site/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## Deploy info" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- events.json: preserved from live Pages (or absent on first deploy)" >> $GITHUB_STEP_SUMMARY
          echo "- venue images: fetched from live Pages (img/venues/, card/, detail/)" >> $GITHUB_STEP_SUMMARY
          echo "- web app: built from web/ and deployed to site root" >> $GITHUB_STEP_SUMMARY

      - name: Alerts (GitHub issues)
        # task 057: issue with label `alert` when the deploy fails, closed by the next success
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m pipeline.alerts --workflow deploy-app --job-status ${{ job.status }}
